[tools]
cmake = "4.4.5"
xcodegen = "2.46.0"
cocogitto = "7.0.0"
lefthook = "2.2.2"
git-cliff = "2.14.2"
node = "26.13.1"
jactionlint = "2.6.0"
zizmor = "1.32.0"
# jactionlint checks workflow run scripts with ShellCheck.
shellcheck = "0.11.0"
# aube refuses packages under 1000 weekly downloads; Tagsmith is published by the Remora owner.
"npm:tagsmith" = { version = "1.2.1", allow_low_downloads = true }

[tasks.engine]
description = "Build the RDP and VNC engines into Vendor/build. Completed stages are skipped."
usage = 'flag "--clean" help="Rebuild every engine stage"'
run = './Vendor/build-engine.sh ${usage_clean:+--clean}'

[tasks.xcodeproj]
description = "Regenerate Remora.xcodeproj from project.yml."
run = "xcodegen generate --quiet"

[tasks.build]
description = "Build the Debug app, Remora Dev, and verify its Apple-issued signature. With REMORA_AD_HOC_SIGNING set, as on CI, sign it ad hoc and verify that signature instead."
depends = ["engine", "xcodeproj"]
run = [
    "xcodebuild -project Remora.xcodeproj -scheme Remora -configuration Debug -derivedDataPath build/DerivedData -quiet build ${REMORA_AD_HOC_SIGNING:+CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=}",
    '''
app='build/DerivedData/Build/Products/Debug/Remora Dev.app'
if [ -n "${REMORA_AD_HOC_SIGNING:-}" ]; then
    codesign --verify --deep --strict "$app"
else
    codesign --verify --deep --strict -R='anchor apple generic' "$app"
fi
''',
]

[tasks.launch]
description = "Build the Debug app, Remora Dev, and launch a new instance of it."
depends = ["build"]
run = "open -n 'build/DerivedData/Build/Products/Debug/Remora Dev.app'"

[tasks.test]
description = "Run the RemoraKit tests."
usage = 'flag "--filter <pattern>" help="Run only the tests that match this pattern"'
depends = ["engine"]
# The VNC session tests time handshakes, so they wait for a build in the same run.
wait_for = ["build"]
run = 'swift test --package-path Packages/RemoraKit ${usage_filter:+--filter "$usage_filter"}'

[tasks.format]
description = "Format the Swift sources in place."
run = "set -o pipefail; git ls-files -z --cached --others --exclude-standard '*.swift' | xargs -0 xcrun swift-format format --in-place --parallel"

[tasks.lint]
description = "Lint the Swift sources."
run = "set -o pipefail; git ls-files -z --cached --others --exclude-standard '*.swift' | xargs -0 xcrun swift-format lint --strict --parallel"

[tasks.check]
description = "Lint, build and test, and check that the committed Remora.xcodeproj matches project.yml. Run it before pushing or opening a PR."
depends = ["lint", "build", "test"]
run = "git diff --exit-code --stat -- Remora.xcodeproj || { echo 'Remora.xcodeproj did not match project.yml. It is regenerated now; commit it.' >&2; exit 1; }"

[tasks."setup:hooks"]
description = "Install the Git hooks in lefthook.yml."
run = "lefthook install"

[tasks."lint:workflows"]
description = "Lint the GitHub Actions workflows and Dependabot configuration."
# zizmor owns the security and pinning rules, so jactionlint checks only correctness.
run = ["jactionlint --profile correctness", "zizmor ."]

[tasks."lint:commit"]
description = "Check that a commit message file is a Conventional Commit."
usage = 'arg "<file>" help="File that holds the commit message or PR title"'
run = "cog verify --file {{usage.file | quote}}"

[tasks."release:notes"]
description = "Print the release notes for unreleased changes."
run = "git-cliff --unreleased --offline --strip all"

[tasks."release:notes:tag"]
description = "Print the release notes for a release tag."
usage = 'arg "<tag>" help="Stable release tag, for example v1.2.3"'
# The range starts at the highest lower stable tag reachable from the tag. Counting only the two
# endpoints keeps any tag between them from splitting the notes. With no lower tag, git-cliff walks
# all history and prints the first-release line.
run = '''
tag={{usage.tag | quote}}
stable='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
printf '%s\n' "$tag" | grep -qE "$stable" || { echo "$tag is not a stable vX.Y.Z tag" >&2; exit 1; }
commit=$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}") || { echo "Tag $tag does not exist" >&2; exit 1; }
previous=$(git tag --merged "refs/tags/$tag" --sort=-v:refname | grep -E "$stable" | awk -v t="$tag" 'f { print; exit } $0 == t { f = 1 }')
git-cliff --offline --strip all --count-tags "^(${previous:+$previous|}$tag)\$" -- "${previous:+$previous..}$commit"
'''

[tasks."release:targets"]
description = "Check the Tagsmith release configuration."
run = "tagsmith targets --json"

[tasks."release:preview"]
description = "Preview the next release tag without creating it."
usage = 'arg "<bump>" help="SemVer part to bump" { choices "major" "minor" "patch"; }'
run = "tagsmith tag --channel stable --bump {{usage.bump}} --dry-run --json"

[tasks."release:tag"]
description = "Create a release tag at HEAD and push it to origin. HEAD must be the commit at origin/main."
usage = 'arg "<version>" help="Version that release:preview printed, for example 1.2.3"'
# Tagsmith tags any commit, so this keeps an unmerged local commit from becoming a release.
run = [
    "git fetch --quiet origin main",
    '[ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo "HEAD is not origin/main. Release only the commit at origin/main: run git switch main and git pull --ff-only, and land local commits through a pull request." >&2; exit 1; }',
    "tagsmith tag --channel stable --version {{usage.version | quote}} --push --json",
]

[tasks."release:validate"]
description = "Validate a release tag on origin and write its facts to $GITHUB_OUTPUT."
usage = 'arg "<tag>" help="Release tag, for example v1.2.3"'
run = "tagsmith validate --tag {{usage.tag | quote}} --github-output"

# The release tasks build the signed and notarized DMG in build/release/dist. On CI they run in
# .github/workflows/release.yml. Locally they need the Developer ID Application certificate in a
# keychain, and release:notarize needs the same NOTARY_* variables as the workflow.

[tasks."release:app"]
description = "Archive, sign and verify Remora.app with the Developer ID certificate."
usage = 'arg "<version>" help="App version, for example 1.2.3"'
depends = ["engine", "xcodeproj"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
version={{usage.version | quote}}
[[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "$version is not an X.Y.Z version" >&2; exit 1; }
team=LZ3V3WUPWR
out=build/release
rm -rf "$out/Remora.xcarchive" "$out/export"
mkdir -p "$out"
# Sparkle compares CFBundleVersion, so both versions are the release version.
xcodebuild -project Remora.xcodeproj -scheme Remora -configuration Release -derivedDataPath build/DerivedData \
    -destination 'generic/platform=macOS' -archivePath "$out/Remora.xcarchive" -quiet archive \
    CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM="$team" \
    MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$version"
options="$out/ExportOptions.plist"
plutil -create xml1 "$options"
plutil -insert method -string developer-id "$options"
plutil -insert signingStyle -string manual "$options"
plutil -insert teamID -string "$team" "$options"
xcodebuild -exportArchive -archivePath "$out/Remora.xcarchive" -exportOptionsPlist "$options" -exportPath "$out/export" -quiet

app="$out/export/Remora.app"
codesign --verify --deep --strict --verbose=2 "$app"
# A Developer ID Application certificate of the team.
requirement="anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] and certificate leaf[field.1.2.840.113635.100.6.1.13] and certificate leaf[subject.OU] = \"$team\""
for code in "$app" "$app/Contents/Helpers/remora"; do
    codesign --verify --strict -R="$requirement" "$code"
    details=$(codesign --display --verbose=2 "$code" 2>&1)
    [[ $details =~ flags=0x[0-9a-f]+\([^\)]*runtime ]] || { echo "$code lacks the hardened runtime" >&2; exit 1; }
    entitlements=$(codesign --display --entitlements - --xml "$code" 2>/dev/null)
    [[ $entitlements != *get-task-allow* ]] || { echo "$code has the get-task-allow entitlement" >&2; exit 1; }
done
echo "Signed and verified $app $version"
'''

[tasks."release:dmg"]
description = "Build and sign the DMG from the app that release:app built."
run = '''
#!/usr/bin/env bash
set -euo pipefail
app=build/release/export/Remora.app
version=$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")
stage=build/release/dmg
dist=build/release/dist
dmg="$dist/Remora-$version-macos-arm64.dmg"
rm -rf "$stage" "$dist"
mkdir -p "$stage" "$dist"
ditto "$app" "$stage/Remora.app"
ln -s /Applications "$stage/Applications"
hdiutil create -quiet -fs APFS -format ULFO -volname Remora -srcfolder "$stage" "$dmg"
codesign --sign "Developer ID Application" --timestamp "$dmg"
codesign --verify --strict --verbose=2 "$dmg"
'''

[tasks."release:notarize"]
description = "Notarize and staple the DMG, assess it with Gatekeeper, and write SHA256SUMS."
run = '''
#!/usr/bin/env bash
set -euo pipefail
: "${NOTARY_KEY_P8_BASE64:?Set it to the base64 App Store Connect API key (.p8)}"
: "${NOTARY_KEY_ID:?Set it to the API key ID}"
: "${NOTARY_ISSUER_ID:?Set it to the API key issuer ID}"
dist=build/release/dist
version=$(plutil -extract CFBundleShortVersionString raw -o - build/release/export/Remora.app/Contents/Info.plist)
dmg="$dist/Remora-$version-macos-arm64.dmg"
key=$(mktemp)
mount=
cleanup() {
    rm -f "$key"
    if [[ -n $mount ]]; then hdiutil detach -quiet "$mount" && rmdir "$mount"; fi
}
trap cleanup EXIT
base64 --decode <<<"$NOTARY_KEY_P8_BASE64" > "$key"
auth=(--key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")

result=$(xcrun notarytool submit "$dmg" "${auth[@]}" --wait --timeout 1h --output-format json) || true
id=$(jq -r '.id // empty' <<<"$result" 2>/dev/null || true)
status=$(jq -r '.status // empty' <<<"$result" 2>/dev/null || true)
# The log lists every issue, including warnings on an accepted submission.
if [[ -n $id ]]; then xcrun notarytool log "$id" "${auth[@]}"; fi
[[ $status == Accepted ]] || { echo "Notarization did not succeed: ${result:-no response}" >&2; exit 1; }
xcrun stapler staple "$dmg"
xcrun stapler validate "$dmg"

spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
mount=$(mktemp -d)
hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mount" "$dmg"
spctl --assess --type exec --verbose=2 "$mount/Remora.app"
(cd "$dist" && shasum -a 256 "${dmg##*/}" > SHA256SUMS)
cat "$dist/SHA256SUMS"
'''

[tasks."release:publish"]
description = "Create the GitHub release for a tag with the DMG and SHA256SUMS in build/release/dist."
usage = '''
arg "<tag>" help="Stable release tag, for example v1.2.3"
arg "<commit>" help="Commit the tag must point to on origin"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
tag={{usage.tag | quote}}
commit={{usage.commit | quote}}
version=${tag#v}
dist=build/release/dist
dmg="Remora-$version-macos-arm64.dmg"
# SHA256SUMS must list only this DMG, and the DMG must match it.
[[ $(cut -d ' ' -f 3- "$dist/SHA256SUMS") == "$dmg" ]] || { echo "$dist/SHA256SUMS does not list only $dmg" >&2; exit 1; }
(cd "$dist" && shasum -a 256 --check SHA256SUMS)
notes=$(mktemp)
trap 'rm -f "$notes"' EXIT
{
    echo "[![Download for macOS](https://img.shields.io/badge/Download-macOS-10B981?style=for-the-badge&labelColor=1F2937&logo=apple&logoColor=white)](https://github.com/sadiksaifi/remora/releases/download/$tag/$dmg)"
    echo
    mise run release:notes:tag "$tag"
} > "$notes"
remote=$(gh api "repos/{owner}/{repo}/commits/refs/tags/$tag" --jq .sha)
[[ $remote == "$commit" ]] || { echo "Tag $tag points to $remote on origin, not $commit" >&2; exit 1; }
gh release create "$tag" --verify-tag --latest --title "Remora $version" --notes-file "$notes" "$dist/$dmg" "$dist/SHA256SUMS"
'''

[tasks."release:secrets"]
description = "Copy the release secrets from the Remora vault in 1Password to the release environment on GitHub. See docs/releasing.md."
usage = 'flag "--dry-run" help="List each secret and its 1Password reference without reading 1Password or changing GitHub"'
# Each value goes from op read to gh secret set through a pipe, so it never reaches disk or the
# terminal. File attachments go to GitHub as base64, as the release workflow decodes them.
run = '''
#!/usr/bin/env bash
# A caller's exported SHELLOPTS can turn on xtrace, which would print every value.
set +x
set -euo pipefail
repo=sadiksaifi/remora
secrets=(
    "DEVELOPER_ID_P12_BASE64|op://Remora/Developer ID Application/developer-id.p12|base64"
    "DEVELOPER_ID_P12_PASSWORD|op://Remora/Developer ID Application/password|text"
    "NOTARY_KEY_P8_BASE64|op://Remora/Notary API key/notary.p8|base64"
    "NOTARY_KEY_ID|op://Remora/Notary API key/key id|text"
    "NOTARY_ISSUER_ID|op://Remora/Notary API key/issuer id|text"
    "SPARKLE_ED_PRIVATE_KEY|op://Remora/Sparkle EdDSA key/private key|text"
)
if [[ ${usage_dry_run:-false} == true ]]; then
    for secret in "${secrets[@]}"; do
        IFS='|' read -r name ref encoding <<<"$secret"
        printf '%-26s %-7s %s\n' "$name" "$encoding" "$ref"
    done
    echo "Dry run: read nothing from 1Password and changed nothing on GitHub."
    exit 0
fi
command -v op >/dev/null || { echo "The 1Password CLI, op, is not installed. Install it with: brew install 1password-cli" >&2; exit 1; }
command -v gh >/dev/null || { echo "The GitHub CLI, gh, is not installed. Install it with: brew install gh" >&2; exit 1; }
gh auth status --hostname github.com >/dev/null || { echo "gh is not signed in to github.com. Run: gh auth login" >&2; exit 1; }
op vault get Remora >/dev/null || { echo "op cannot open the Remora vault. Sign in to the 1Password CLI and check that the vault exists." >&2; exit 1; }
# Every value is read before any secret changes, so a missing reference changes nothing.
values=()
for secret in "${secrets[@]}"; do
    IFS='|' read -r name ref encoding <<<"$secret"
    if [[ $encoding == base64 ]]; then
        value=$(op read --no-newline "$ref" | base64) || { echo "Cannot read $ref for $name." >&2; exit 1; }
    else
        value=$(op read --no-newline "$ref") || { echo "Cannot read $ref for $name." >&2; exit 1; }
    fi
    [[ -n $value ]] || { echo "$ref for $name is empty." >&2; exit 1; }
    values+=("$value")
done
# GitHub sets each secret on its own, so a failure leaves the earlier ones already changed.
written=()
for i in "${!secrets[@]}"; do
    name=${secrets[i]%%|*}
    printf '%s' "${values[i]}" | gh secret set "$name" --env release --repo "$repo" || {
        echo "Setting $name failed. Already changed: ${written[*]:-none}." >&2
        echo "Run mise run release:secrets again until it succeeds before you release or rehearse." >&2
        exit 1
    }
    written+=("$name")
done
'''
