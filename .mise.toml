[tools]
cmake = "4.4.5"
xcodegen = "2.46.0"
cocogitto = "7.0.0"
lefthook = "2.2.2"
git-cliff = "2.14.2"
node = "26.13.1"
# aube refuses packages under 1000 weekly downloads; Tagsmith is published by the Remora owner.
"npm:tagsmith" = { version = "1.2.1", allow_low_downloads = true }

[tasks.engine]
description = "Build the RDP and VNC engines into Vendor/build. Completed stages are skipped."
usage = 'flag "--clean" help="Rebuild every engine stage"'
run = './Vendor/build-engine.sh ${usage_clean:+--clean}'

[tasks.xcodeproj]
description = "Regenerate Remora.xcodeproj from project.yml."
run = "xcodegen generate --quiet"

[tasks.build]
description = "Build the Debug app and verify its Apple-issued signature."
depends = ["engine", "xcodeproj"]
run = [
    "xcodebuild -project Remora.xcodeproj -scheme Remora -configuration Debug -derivedDataPath build/DerivedData -quiet build",
    "codesign --verify --deep --strict -R='anchor apple generic' build/DerivedData/Build/Products/Debug/Remora.app",
]

[tasks.launch]
description = "Build the Debug app and launch a new instance of it."
depends = ["build"]
run = "open -n build/DerivedData/Build/Products/Debug/Remora.app"

[tasks.test]
description = "Run the RemoraKit tests."
usage = 'flag "--filter <pattern>" help="Run only the tests that match this pattern"'
depends = ["engine"]
# The VNC session tests time handshakes, so they wait for a build in the same run.
wait_for = ["build"]
run = 'swift test --package-path Packages/RemoraKit ${usage_filter:+--filter "$usage_filter"}'

[tasks.format]
description = "Format the Swift sources in place."
run = "set -o pipefail; git ls-files -z --cached --others --exclude-standard '*.swift' | xargs -0 xcrun swift-format format --in-place --parallel"

[tasks.lint]
description = "Lint the Swift sources."
run = "set -o pipefail; git ls-files -z --cached --others --exclude-standard '*.swift' | xargs -0 xcrun swift-format lint --strict --parallel"

[tasks.check]
description = "Lint, build and test, and check that the committed Remora.xcodeproj matches project.yml. Run it before pushing or opening a PR."
depends = ["lint", "build", "test"]
run = "git diff --exit-code --stat -- Remora.xcodeproj || { echo 'Remora.xcodeproj did not match project.yml. It is regenerated now; commit it.' >&2; exit 1; }"

[tasks."setup:hooks"]
description = "Install the Git hooks in lefthook.yml."
run = "lefthook install"

[tasks."lint:commit"]
description = "Check that a commit message file is a Conventional Commit."
usage = 'arg "<file>" help="File that holds the commit message or PR title"'
run = "cog verify --file {{usage.file | quote}}"

[tasks."release:notes"]
description = "Print the release notes for unreleased changes."
run = "git-cliff --unreleased --offline --strip all"

[tasks."release:notes:tag"]
description = "Print the release notes for a release tag."
usage = 'arg "<tag>" help="Release tag, for example v1.2.3"'
# The range starts after the previous stable tag. With no previous tag, git-cliff walks all history and prints the first-release line.
run = '''
commit=$(git rev-parse --verify {{usage.tag | quote}}^{commit}) || exit 1
previous=$(git tag --list 'v*' --merged {{usage.tag | quote}}^ --sort=-v:refname | grep -m 1 -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || true)
git-cliff --offline --strip all -- "${previous:+$previous..}$commit"
'''

[tasks."release:targets"]
description = "Check the Tagsmith release configuration."
run = "tagsmith targets --json"

[tasks."release:preview"]
description = "Preview the next release tag without creating it."
usage = 'arg "<bump>" help="SemVer part to bump" { choices "major" "minor" "patch"; }'
run = "tagsmith tag --channel stable --bump {{usage.bump}} --dry-run --json"

[tasks."release:tag"]
description = "Create a release tag at HEAD and push it to origin."
usage = 'arg "<version>" help="Version that release:preview printed, for example 1.2.3"'
run = "tagsmith tag --channel stable --version {{usage.version | quote}} --push --json"

[tasks."release:validate"]
description = "Validate a release tag on origin and write its facts to $GITHUB_OUTPUT."
usage = 'arg "<tag>" help="Release tag, for example v1.2.3"'
run = "tagsmith validate --tag {{usage.tag | quote}} --github-output"
