[tools]
cmake = "4.4.5"
xcodegen = "2.46.0"

[tasks.setup]
description = "Install the pinned tools and build the RDP and VNC engines into Vendor/build. Run it once after cloning. Pass --clean to rebuild every engine stage."
run = ["mise install", "./Vendor/build-engine.sh"]

[tasks.generate]
description = "Regenerate Remora.xcodeproj from project.yml."
run = "xcodegen generate"

[tasks.build]
description = "Regenerate the project and build the Debug app. Run the setup task once first."
depends = ["generate"]
run = "xcodebuild -project Remora.xcodeproj -scheme Remora -configuration Debug -derivedDataPath build/DerivedData -quiet build"

[tasks.run]
description = "Build the Debug app and launch a new instance of it."
depends = ["build"]
run = "open -n build/DerivedData/Build/Products/Debug/Remora.app"

[tasks.test]
description = "Run the RemoraKit tests. Run the setup task once first. Extra arguments go to swift test, such as --filter."
run = "swift test --package-path Packages/RemoraKit"

[tasks.format]
description = "Format the Swift sources in place."
run = "set -o pipefail; git ls-files -z --cached --others --exclude-standard '*.swift' | xargs -0 xcrun swift-format format --in-place --parallel"

[tasks.check]
description = "Lint the Swift sources, check that Remora.xcodeproj matches project.yml, build and test. Run it before pushing or opening a PR."
run = [
    "set -o pipefail; git ls-files -z --cached --others --exclude-standard '*.swift' | xargs -0 xcrun swift-format lint --strict --parallel",
    "xcodegen generate --quiet && { git diff --exit-code --stat -- Remora.xcodeproj || { echo 'Remora.xcodeproj did not match project.yml. It is regenerated now; commit it.' >&2; exit 1; }; }",
    "mise run build",
    "mise run test",
]
