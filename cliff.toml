# Release notes for `mise run release:notes` and `mise run release:notes:tag`.
# The owner writes the first release's notes by hand, so it prints one line.

[changelog]
body = """
{% if not previous.version %}\
First release of Remora.
{% else %}\
{% for group, commits in commits | group_by(attribute="group") %}\
{% if not loop.first %}
{% endif %}\
### {{ group | striptags | trim }}

{% for commit in commits %}\
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/sadiksaifi/remora/commit/{{ commit.id }}))
{% endfor %}\
{% endfor %}\
{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
# Stable SemVer tags only, as Tagsmith creates them.
tag_pattern = '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
sort_commits = "oldest"
# The comments sort the groups; the template strips them.
commit_parsers = [
  { message = '(?i)^feat[(!:]', group = "<!-- 0 -->Features" },
  { message = '(?i)^fix[(!:]', group = "<!-- 1 -->Fixes" },
  { message = '(?i)^perf[(!:]', group = "<!-- 2 -->Performance" },
  { message = '(?i)^docs[(!:]', group = "<!-- 3 -->Documentation" },
  { message = '(?i)^(build|chore|ci|refactor|revert|style|test)[(!:]', group = "<!-- 4 -->Maintenance" },
  { message = ".*", group = "<!-- 5 -->Other changes" },
]
