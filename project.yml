name: Remora
options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "27.2"
  deploymentTarget:
    macOS: "26.0"
packages:
  RemoraKit:
    path: Packages/RemoraKit
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    from: 1.7.0
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MTL_TREAT_WARNINGS_AS_ERRORS: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Notarization requires the hardened runtime.
    ENABLE_HARDENED_RUNTIME: YES
    INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Peblon
  # Remora and Remora Dev keep separate data, Keychain items, settings, control sockets and links.
  # The app derives each of them at runtime from its bundle identifier and name (AppIdentity).
  configs:
    Debug:
      REMORA_BUNDLE_IDENTIFIER: com.peblon.remora.dev
      REMORA_NAME: Remora Dev
    Release:
      REMORA_BUNDLE_IDENTIFIER: com.peblon.remora
      REMORA_NAME: Remora
targets:
  Remora:
    type: application
    platform: macOS
    sources:
      - path: Remora
        type: syncedFolder
      - path: Vendor/licenses
        type: folder
        buildPhase: resources
    dependencies:
      - target: RemoraCLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - package: RemoraKit
        product: RemoraControl
      - package: RemoraKit
        product: RemoraCore
      - package: RemoraKit
        product: RDPSession
      - package: RemoraKit
        product: VNCSession
    postBuildScripts:
      # A skill's name must match its folder, so Remora Dev bundles the skill as remora-dev and names its own command in it.
      - name: Bundle agent skill
        script: |
          command=$(echo "$PRODUCT_NAME" | tr 'A-Z ' 'a-z-')
          skill="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/skills/$command"
          mkdir -p "$skill"
          sed -e "s/^name: remora$/name: $command/" -e "s/\`remora/\`$command/g" "$SRCROOT/skills/remora/SKILL.md" > "$skill/SKILL.md"
        inputFiles:
          - $(SRCROOT)/skills/remora/SKILL.md
        basedOnDependencyAnalysis: false
      # Checks the skill, the failure hints and the command descriptions with the embedded, signed CLI, without running a command.
      - name: Check agent help
        script: '"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/remora" __check-help "$SRCROOT/skills/remora/SKILL.md"'
        inputFiles:
          - $(SRCROOT)/skills/remora/SKILL.md
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(REMORA_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: $(REMORA_NAME)
        PRODUCT_MODULE_NAME: Remora
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LZ3V3WUPWR
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(REMORA_NAME)
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Remora connects to remote computers on your local network.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
  RemoraCLI:
    productName: remora
    type: tool
    platform: macOS
    sources:
      - path: RemoraCLI
    dependencies:
      - package: RemoraKit
        product: RemoraControl
      - package: ArgumentParser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: remora
        PRODUCT_MODULE_NAME: RemoraCLI
        PRODUCT_BUNDLE_IDENTIFIER: $(REMORA_BUNDLE_IDENTIFIER).cli
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LZ3V3WUPWR
        SKIP_INSTALL: YES
        # An Info.plist in the binary lets macOS name the app in privacy and Keychain prompts.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(REMORA_NAME)
schemes:
  Remora:
    build:
      targets:
        Remora: all
    run:
      config: Debug
    archive:
      config: Release
