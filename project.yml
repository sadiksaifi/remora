name: Remora
options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "27.1"
  deploymentTarget:
    macOS: "26.0"
packages:
  RemoraKit:
    path: Packages/RemoraKit
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    from: 1.7.0
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Remora:
    type: application
    platform: macOS
    sources:
      - path: Remora
        type: syncedFolder
      - path: Vendor/licenses
        type: folder
        buildPhase: resources
      # Copied whole to Contents/Resources/skills/remora.
      - path: skills
        type: folder
        buildPhase: resources
    dependencies:
      - target: RemoraCLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - package: RemoraKit
        product: RemoraControl
      - package: RemoraKit
        product: RemoraCore
      - package: RemoraKit
        product: RDPSession
      - package: RemoraKit
        product: VNCSession
    # Parses every `remora ...` line in the skill with the embedded, signed CLI, without running it.
    postBuildScripts:
      - name: Check skill commands
        script: '"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/remora" __check-skill "$SRCROOT/skills/remora/SKILL.md"'
        inputFiles:
          - $(SRCROOT)/skills/remora/SKILL.md
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sadiksaifi.Remora
        PRODUCT_NAME: Remora
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LZ3V3WUPWR
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Remora connects to remote computers on your local network.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
  RemoraCLI:
    productName: remora
    type: tool
    platform: macOS
    sources:
      - path: RemoraCLI
    dependencies:
      - package: RemoraKit
        product: RemoraControl
      - package: ArgumentParser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: remora
        PRODUCT_MODULE_NAME: RemoraCLI
        PRODUCT_BUNDLE_IDENTIFIER: dev.sadiksaifi.Remora.cli
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LZ3V3WUPWR
        SKIP_INSTALL: YES
schemes:
  Remora:
    build:
      targets:
        Remora: all
    run:
      config: Debug
    archive:
      config: Release
